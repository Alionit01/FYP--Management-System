[project]
name = "fyp-finder-backend"
version = "0.1.0"
description = "FYP Finder backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]==0.141.1",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.5",
    "python-dotenv==1.2.3",
    "email-validator==2.3.0",
    "bcrypt==4.0.1",
    "PyJWT==2.15.1"
]

[tool.fastapi]
entrypoint = "app.main:app"